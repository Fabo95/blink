[package]
name = "blink"
version = "0.1.0"
description = "Blink — Enterprise-Ready Local-First Task Ingestion System"
authors = ["Blink Inc."]
edition = "2021"
rust-version = "1.77"

[lib]
name = "blink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
ts-rs = "10.1.0"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Local task store: SQLCipher (AES-256 at rest). The vendored feature compiles
# SQLCipher + OpenSSL from source, so builds need no system crypto libraries.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
# Versioned schema migrations + serde-based row↔struct mapping (pinned to the
# releases that target rusqlite 0.32).
rusqlite_migration = "1.3"
serde_rusqlite = "0.36"
# The DB encryption key lives in the OS keychain (macOS Keychain / Windows
# Credential Manager / Secret Service), never in plaintext on disk.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Zero-knowledge sync crypto (2SKD): AES-256-GCM record/VMK encryption, PBKDF2 +
# HMAC-SHA256 key derivation (master password + Secret Key → KEK), base64 envelopes,
# and an OS CSPRNG for keys/nonces. Pure-Rust (RustCrypto), no system libraries.
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
getrandom = "0.2"

# Global shortcuts + input simulation are desktop-only (the capture hotkey and
# its "copy the current selection" step).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
enigo = "0.3.0"
dotenvy = "0.15"

# Capture-source detection: the frontmost app (AppKit) and its focused window
# title (Accessibility API). macOS-only — every other platform returns no source.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# objc2 framework crates gate every class behind a feature named after it.
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
accessibility-sys = "0.1"
core-foundation = "0.10"
