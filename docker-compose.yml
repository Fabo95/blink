services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blink
      POSTGRES_USER: blink
      POSTGRES_PASSWORD: blink_dev_password
    ports:
      # Host port configurable to avoid clashing with a local Postgres.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - blink_pgdata:/var/lib/postgresql/data
      # Dev convenience: drizzle-generated migrations run once, alphabetically, on
      # first init. For real deploys use `pnpm --filter @blink/db db:migrate`.
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blink -d blink']
      interval: 5s
      timeout: 3s
      retries: 10

  sync-server:
    build:
      context: .
      dockerfile: apps/sync-server/Dockerfile
    environment:
      PORT: 8787
      # The API connects as the least-privilege, RLS-bound role.
      DATABASE_URL: postgres://blink_api:blink_api_dev_password@postgres:5432/blink
    ports:
      - '8787:8787'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  blink_pgdata:
