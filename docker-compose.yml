# Self-hosted Cloud tier for Blink (Phase 2 / VPC). No Supabase — just Postgres
# and the thin sync API. `docker compose up` gives you the full backend locally.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blink
      POSTGRES_USER: blink
      POSTGRES_PASSWORD: blink_dev_password
    ports:
      - '5432:5432'
    volumes:
      - blink_pgdata:/var/lib/postgresql/data
      # Migrations run once, alphabetically, on first init.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blink -d blink']
      interval: 5s
      timeout: 3s
      retries: 10

  sync-server:
    build:
      context: .
      dockerfile: apps/sync-server/Dockerfile
    environment:
      PORT: 8787
      # The API connects as the least-privilege, RLS-bound role.
      DATABASE_URL: postgres://blink_api:blink_api_dev_password@postgres:5432/blink
    ports:
      - '8787:8787'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  blink_pgdata:
