services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blink
      POSTGRES_USER: blink
      POSTGRES_PASSWORD: blink_dev_password
    ports:
      # Host port configurable to avoid clashing with a local Postgres.
      - '5432:5432'
    volumes:
      - blink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blink -d blink']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies pending Drizzle migrations (recorded in __drizzle_migrations),
  # then exits — the server waits for it to succeed. Reuses the server image, which
  # bundles @blink/db + drizzle-kit + the migrations. Runs as the owner so it can
  # create/alter tables.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ['pnpm', '--filter', '@blink/db', 'db:migrate']
    environment:
      DATABASE_URL: postgres://blink:blink_dev_password@postgres:5432/blink
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 8787
      # Least-privilege: the server connects as `blink_api` (created by migration 0001)
      # — RLS is enforced and it only holds grants on the tables it needs (tasks +
      # the Better Auth tables). The owner `blink` is used solely by the migrate
      # service for DDL + GRANTs; that's why this waits on migrate to finish.
      DATABASE_URL: postgres://blink_api:blink_api_dev_password@postgres:5432/blink
    ports:
      - '8787:8787'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  blink_pgdata:
