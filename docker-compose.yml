services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blink
      POSTGRES_USER: blink
      POSTGRES_PASSWORD: blink_dev_password
    ports:
      # Host port configurable to avoid clashing with a local Postgres.
      - '5432:5432'
    volumes:
      - blink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blink -d blink']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies pending Drizzle migrations (recorded in __drizzle_migrations),
  # then sets the blink_api password from POSTGRES_BLINK_API_PASSWORD (migration 0001 creates
  # the role with no password — it can't log in until this runs) and exits — the
  # server waits for it to succeed. Reuses the server image, which bundles @blink/db
  # + drizzle-kit + the migrations. Runs as the owner so it can create/alter tables
  # and roles.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ['pnpm', '--filter', '@blink/db', 'db:deploy']
    environment:
      DATABASE_URL: postgres://blink:blink_dev_password@postgres:5432/blink
      # Must be URL-safe — it's also interpolated into the server's DATABASE_URL below.
      POSTGRES_BLINK_API_PASSWORD: ${POSTGRES_BLINK_API_PASSWORD:-blink_api_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    # Secrets + config come from apps/server/.env (RESEND_API_KEY, BETTER_AUTH_SECRET, …);
    # `environment` below overrides DATABASE_URL for the compose network.
    env_file:
      - apps/server/.env
    environment:
      PORT: 8787
      # The image is prod-pruned (no pino-pretty), so force production logging even
      # though the shared .env sets development for local `pnpm dev`.
      ENVIRONMENT: production
      # Least-privilege: the server connects as `blink_api` (created by migration 0001)
      # — RLS is enforced and it only holds grants on the tables it needs (tasks +
      # the Better Auth tables). The owner `blink` is used solely by the migrate
      # service for DDL + GRANTs + the blink_api password; that's why this waits on
      # migrate to finish.
      DATABASE_URL: postgres://blink_api:${POSTGRES_BLINK_API_PASSWORD:-blink_api_dev_password}@postgres:5432/blink
    ports:
      - '8787:8787'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  blink_pgdata:
