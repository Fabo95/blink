name: Deploy server

# Build the server image, push it to Docker Hub, then SSH into the Hetzner box and
# pull + (re)start the Blink services inside your existing Caddy/n8n compose.
# Postgres is external (managed); Caddy reverse-proxies to the container over the
# shared `web` network.
on:
  push:
    branches: [master]
    paths:
      - 'apps/server/**'
      - 'packages/contract/**'
      - 'packages/db/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

# Never let two deploys race on the box.
concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/blink-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_COMPOSE_DIR }}
            echo "${{ secrets.DOCKERHUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            # Pin this deploy to the exact commit image (overrides the .env fallback).
            export IMAGE="${{ env.IMAGE }}:${{ github.sha }}"
            docker compose pull blink-migrate blink-server
            # up blink-server runs blink-migrate first (depends_on), then starts the API.
            docker compose up -d blink-server
            docker image prune -f
            docker logout
