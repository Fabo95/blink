name: Deploy web

# Mirror of deploy-server.yml: build the static download page into an nginx image,
# push it to Docker Hub, then SSH into the box and (re)start the container inside the
# existing Caddy/n8n compose. Caddy reverse-proxies to it over the shared `web`
# network (see apps/web/deploy/). The download base URL is baked in at build time.
on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/blink-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_DOWNLOADS_BASE_URL=${{ vars.DOWNLOADS_BASE_URL }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_COMPOSE_DIR }}
            echo "${{ secrets.DOCKERHUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            # Pin this deploy to the exact commit image (overrides the compose :latest fallback).
            export BLINK_WEB_IMAGE="${{ env.IMAGE }}:${{ github.sha }}"
            docker compose pull blink-web
            docker compose up -d blink-web
            docker image prune -f
            docker logout
